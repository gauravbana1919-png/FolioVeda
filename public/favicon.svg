<svg width="64" height="64" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fav-left" x1="20" y1="20" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="fav-right" x1="80" y1="20" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="fav-center" x1="50" y1="10" x2="50" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="fav-spark" x1="42" y1="36" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
  </defs>

  <!-- Ambient Dark Background for browser tabs -->
  <rect width="100" height="100" rx="24" fill="#0B0F19" />

  <!-- Outer Folio Leaves / Outer Vedic Petals -->
  <path d="M 50 86 C 26 86 14 65 16 43 C 17 30 26 21 44 19 C 35 34 35 58 50 86 Z" fill="url(#fav-left)" fill-opacity="0.9" />
  <path d="M 50 86 C 74 86 86 65 84 43 C 83 30 74 21 56 19 C 65 34 65 58 50 86 Z" fill="url(#fav-right)" fill-opacity="0.9" />

  <!-- Central Ascending Flame / Wisdom Spine -->
  <path d="M 50 14 C 43 30 42 50 50 80 C 58 50 57 30 50 14 Z" fill="url(#fav-center)" />

  <!-- Illuminated Diamond Core -->
  <polygon points="50,34 58,47 50,60 42,47" fill="url(#fav-spark)" />

  <!-- Digital Folio Nodes -->
  <circle cx="50" cy="22" r="2.5" fill="#FFFFFF" />
  <circle cx="30" cy="40" r="2" fill="#BAE6FD" />
  <circle cx="70" cy="40" r="2" fill="#DDD6FE" />
</svg>
